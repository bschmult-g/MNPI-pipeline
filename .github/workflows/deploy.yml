name: Deploy MNPI Compliance Agent to Vertex AI Agent Runtime

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      target:
        description: 'Agents to update in-place (all, pipeline, compliance, fact-checker, decision-authority)'
        required: false
        default: 'all'
      region:
        description: 'Google Cloud region for Agent Runtime deployment'
        required: false
        default: 'us-central1'

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy to Agent Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: 'green-carrier-500109-k2'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/799321431260/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'github-actions-deployer@green-carrier-500109-k2.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud Authentication
        run: |
          gcloud config set project green-carrier-500109-k2
          echo "Authenticated active account:"
          gcloud auth list
          echo "Current project: $(gcloud config get-value project)"

      - name: Run Compliance Pipeline Test Suite
        run: |
          python test_suite.py

      - name: Deploy Agents to Vertex AI Agent Engine (In-Place Update)
        run: |
          DEPLOY_REGION="${{ github.event.inputs.region || 'us-central1' }}"
          DEPLOY_TARGET="${{ github.event.inputs.target || 'pipeline' }}"
          echo "======================================================="
          echo "🚀 Updating Vertex AI Agent Engine instances IN-PLACE..."
          echo "   Target:             ${DEPLOY_TARGET}"
          echo "   Compliance Agent:   5693910574635679744"
          echo "   Fact Checker Agent: 7905177991674593280"
          echo "   Decision Authority: 6736493888371949568"
          echo "   Region:             ${DEPLOY_REGION}"
          echo "======================================================="
          
          python deploy_agents.py --target="${DEPLOY_TARGET}" --location="${DEPLOY_REGION}"

name: Deploy MNPI Compliance Agent to Vertex AI Agent Runtime

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      region:
        description: 'Google Cloud region for Agent Runtime deployment'
        required: false
        default: 'us'
      agent_engine_id:
        description: 'Existing Agent Engine / Runtime ID to update (leave blank to create a new instance)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy to Agent Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: 'green-carrier-500109-k2'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/799321431260/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'github-actions-deployer@green-carrier-500109-k2.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Google Cloud Authentication
        run: |
          gcloud config set project green-carrier-500109-k2
          echo "Authenticated active account:"
          gcloud auth list
          echo "Current project: $(gcloud config get-value project)"

      - name: Run Compliance Pipeline Test Suite
        run: |
          python test_suite.py

      - name: Deploy Both Agents to Vertex AI Agent Engine
        run: |
          DEPLOY_REGION="${{ github.event.inputs.region || 'us-central1' }}"
          echo "Deploying Two-Agent Pipeline to Agent Engine (Region: ${DEPLOY_REGION})..."
          echo "Agent 1: mnpi-fact-checker-agent"
          echo "Agent 2: mnpi-decision-authority-agent"
          
          python deploy_agents.py
